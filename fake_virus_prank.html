<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Scan</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#39ff14;font-family:monospace}
  body{display:flex;align-items:center;justify-content:center}
  .screen{width:min(900px,92vw);height:min(600px,88vh);border:2px solid #39ff14;padding:24px;box-sizing:border-box;background:#020202;box-shadow:0 0 25px #39ff1433}
  .top{color:#fff;border-bottom:1px solid #39ff14;padding-bottom:12px}
  .warning{color:#ff3333;font-size:clamp(22px,4vw,42px);font-weight:bold;margin:35px 0 12px;text-shadow:0 0 12px #ff0000}
  .bar{height:22px;border:1px solid #39ff14;margin:20px 0}
  .fill{height:100%;width:0;background:#39ff14;transition:width .15s}
  #log{height:170px;overflow:hidden;line-height:1.5}
  .red{color:#ff3333}.white{color:#ddd}
  button{background:#39ff14;color:#000;border:0;padding:12px 18px;font:bold 16px monospace;cursor:pointer}
  .hidden{display:none}
  .center{text-align:center}
  .big{font-size:clamp(30px,7vw,70px);font-weight:bold;color:#39ff14;text-shadow:0 0 20px #39ff14}
</style>
</head>
<body>
<div class="screen">
  <div class="top">SECURITY TERMINAL v4.7.1 — SYSTEM DIAGNOSTIC</div>

  <section id="scan">
    <div class="warning">⚠ THREAT DETECTED</div>
    <div class="white">Unauthorized activity found. Running emergency system scan...</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div id="percent">0%</div>
    <div id="log"></div>
  </section>

  <section id="result" class="hidden center">
    <div class="big">PRANKED 😭</div>
    <p class="white">Nothing happened. This was just a harmless fake-virus screen.</p>
    <button onclick="location.reload()">Run Again</button>
  </section>
</div>

<script>
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");
const log=document.getElementById("log");
const scan=document.getElementById("scan");
const result=document.getElementById("result");

const messages=[
 "Scanning memory...",
 "Checking system files...",
 "Analyzing network connections...",
 "Searching for suspicious activity...",
 "Checking startup entries...",
 "Scanning temporary files...",
 "Verifying system integrity...",
 "Finalizing diagnostic..."
];

let p=0;
const timer=setInterval(()=>{
  p+=Math.floor(Math.random()*5)+1;
  if(p>100)p=100;
  fill.style.width=p+"%";
  percent.textContent=p+"%";
  if(Math.random()<.45){
    const d=document.createElement("div");
    d.textContent="[SCAN] "+messages[Math.floor(Math.random()*messages.length)];
    log.appendChild(d);
    while(log.children.length>8) log.removeChild(log.firstChild);
  }
  if(p>=100){
    clearInterval(timer);
    setTimeout(()=>{
      scan.classList.add("hidden");
      result.classList.remove("hidden");
    },900);
  }
},180);
</script>
</body>
</html>
